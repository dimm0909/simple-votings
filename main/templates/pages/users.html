{% extends 'base/base.html' %}


{% block content %}
 <div class="row mt-3">
    <div class="container">
      <div class="border rounded shadow-sm bg-white py-1 px-2">
        <h3>Пользователи</h3>
      </div>
    </div>
  </div>

<div class="row mt-3">
  <div class="container">
    <div class="border rounded shadow-sm bg-white px-3 py-2">
      <h4>Все пользователи, зарегистрированные на сайте:</h4>
      <table class="table table-bordered table-hover text-center">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Имя</th>
            <th scope="col">Email</th>
            <th scope="col">Админ</th>

          </tr>
        </thead>
        <tbody>
        {% for item in users %}
        <tr>
          <th> {{ item.pk }}</th>
          <th> {{ item }} </th>
          <th> {{ item.email }} </th>
            {% if item.is_superuser %}
          <th>Да
          </th>
            {% else %}
          <th>
            Нет
          </th>
          {% endif %}
        </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
