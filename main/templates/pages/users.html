{% extends 'base/base.html' %}


{% block content %}

<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Email</th>

    </tr>
  </thead>
  <tbody>
  {% for item in users %}
  <tr>
    <th> {{ item.pk }}</th>
    <th> {{ item }} </th>
    <th> {{ item.email }} </th>
  </tr>
  {% endfor %}
  </tbody>
</table>


{% endblock %}
