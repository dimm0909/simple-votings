{% extends 'base/base.html' %}


{% block content %}
 <div class="row mt-3">
    <div class="container">
      <div class="border rounded shadow-sm bg-white py-1 px-2">
        <h3>Пользователи</h3>
      </div>
    </div>
  </div>

<div style="display: inline-block;" class="container w-25 mt-3 mb-2">
    <form type="get">
      <div class="input-group">
        <input class ="form-control" name="search"  placeholder="Искать здесь..." type="search" id="login_onput">
          <button class="btn btn-outline-secondary" type="submit">Поиск</button>
      </div>
    </form>
</div>

<div class="row mt-3">
  <div class="container">
    <div class="border rounded shadow-sm bg-white px-3 py-2">
      <h4>Все пользователи, зарегистрированные на сайте:</h4>
      <table class="table table-bordered table-hover text-center">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Имя</th>
            <th scope="col">Email</th>
            <th scope="col">Админ</th>

          </tr>
        </thead>
        <tbody>
        {% for item in users %}
        <tr>
          <th> {{ item.id }}</th>
          <th> <a class = "link-dark" href="/profile/{{ item.id }}"> {{ item }} </a></th>
          <th> {{ item.email }} </th>
            {% if item.is_superuser %}
          <th>Да
          </th>
            {% else %}
          <th>
            Нет
          </th>
          {% endif %}
        </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
 </div>

<script>
  function search_user(){
    let a = document.getElementById("login_input")

    document.location.href = `/profile/${a.value}`
  }
</script>

{% endblock %}
