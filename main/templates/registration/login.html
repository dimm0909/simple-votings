{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block content %}

  <div class="row mt-3">
    <div class="container">
      <div class="border rounded shadow-sm bg-white py-1 px-2">
        <h3 class="text-center">Авторизация</h3>
      </div>
    </div>
  </div>

    <hr>
    <div class="container w-25">
      <div class="border text-center rounded shadow-sm bg-white p-3">
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
              {{ form | crispy }}
              <div class="py-2"><input class="btn btn-lg btn-primary mt-2" type="submit" value="Войти"></div>
              <div class="container bordered text-center px-0 mt-3 mb-3">
                Нет аккаунта?
                <a href="/accounts/register/">Регистрация</a>
              </div>
        </form>
      </div>
    </div>

    {% if form.errors %}
    {{ form.error }}
    {% endif %}

{% endblock %}
